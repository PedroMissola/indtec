name: 🚀 CI/CD - Build & Deploy

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: 📦 Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout do código
        uses: actions/checkout@v4

      - name: 🟢 Setup do PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.0   # mesma versão do package.json

      - name: 🟢 Setup do Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: 📦 Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: 🔍 Rodar Linter (Opcional)
        run: pnpm run lint || true

      - name: 🏗️ Construir a aplicação
        run: pnpm run build
        env:
          NEXT_PUBLIC_ANALYTICS_ID: ${{ secrets.NEXT_PUBLIC_ANALYTICS_ID }}

      - name: 📤 Fazer upload do build como artefato
        uses: actions/upload-artifact@v4
        with:
          name: next-build-output
          path: |
            .next
            public
            package.json
            pnpm-lock.yaml
          retention-days: 7

  deploy-vercel:
    name: 🌍 Deploy para Vercel
    needs: build-and-test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout do código
        uses: actions/checkout@v4

      - name: 🟢 Setup do PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.0   # alinhado com a job de build

      - name: 🟢 Setup do Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: 📦 Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: 🏗️ Build para produção
        run: pnpm run build
        env:
          NEXT_PUBLIC_ANALYTICS_ID: ${{ secrets.NEXT_PUBLIC_ANALYTICS_ID }}

      - name: 🔗 Deploy na Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'